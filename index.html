<!doctype html>
<html lang="id" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoldVenture — Rental Alat Hiking Premium</title>
  <meta name="description"
    content="GoldVenture adalah platform rental alat hiking premium untuk pendakian, camping, dan trip outdoor di Indonesia." />

  <link rel="preconnect" href="https://images.unsplash.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- styling tambahan css jika class tailwind tidak mendukung component yang di buat -->
  <style type="text/tailwindcss">
    @theme {
      --font-sans: Inter, ui-sans-serif, system-ui, sans-serif;
      --color-forest: #0b2f21;
      --color-forest-2: #123f2b;
      --color-moss: #1f6a43;
      --color-gold: #d7a441;
      --color-cream: #f7f5ed;
      --shadow-premium: 0 18px 48px rgba(9, 33, 24, 0.12);
    }
    .logo-text {
      font-family: 'Cinzel', serif;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .glass-nav {
      background: transparent;
      box-shadow: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      animation: navbarBg linear both;
      animation-timeline: scroll();
      animation-range: 0 140px;
    }

    @keyframes navbarBg {
      to {
        background: linear-gradient(90deg, rgba(215, 164, 65, 0.85), rgba(224, 179, 80, 0.92));
        border-color: rgba(255, 255, 255, 0.35);
        box-shadow: 0 16px 45px rgba(9, 33, 24, 0.14);
        backdrop-filter: blur(28px) saturate(260%);
        -webkit-backdrop-filter: blur(18px) saturate(260%);
      }
    }

    #logoText {
      background: linear-gradient(90deg, #6f8f4e 0%, #ffffff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: logoTextColor linear both;
      animation-timeline: scroll();
      animation-range: 0 140px;
    }

    #logoSubText {
      color: rgba(255, 255, 255, 0.78);
      animation: logoSubTextColor linear both;
      animation-timeline: scroll();
      animation-range: 0 140px;
    }

    @keyframes logoTextColor { to { background: none; -webkit-background-clip: initial; background-clip: initial; color: #0b2f21; } }
    @keyframes logoSubTextColor { to { color: #64748b; } }

    .hero-bg {
      background-image:
        radial-gradient(circle at 18% 22%, rgba(215, 164, 65, 0.28), transparent 23%),
        radial-gradient(circle at 76% 14%, rgba(255, 255, 255, 0.16), transparent 18%),
        linear-gradient(90deg, rgba(3, 18, 13, 0.96) 0%, rgba(6, 36, 24, 0.88) 40%, rgba(8, 38, 26, 0.44) 73%, rgba(8, 38, 26, 0.12) 100%),
        url('https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=2400&q=92');
      background-size: cover;
      background-position: center;
    }

    .soft-grid {
      background-image:
        linear-gradient(rgba(11, 47, 33, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(11, 47, 33, 0.035) 1px, transparent 1px);
      background-size: 38px 38px;
    }

    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .mobile-panel { max-height: 0; opacity: 0; overflow: hidden; }
    .search-shell { box-shadow: 0 26px 70px rgba(9, 33, 24, 0.13), 0 1px 0 rgba(255, 255, 255, 0.9) inset; }
    .search-control { position: relative; }
    .search-trigger, .search-field { min-height: 78px; }
    .dropdown-panel { display: none; }
    .hero-carousel-track { display: flex; }
    .hero-slide { flex: 0 0 100%; }
    .hero-slide img { transform: scale(1.02); }
    .carousel-dot.is-active { width: 1.7rem; background: #d7a441; }
    input[type="date"] { color-scheme: light; }
    .icon-shadcn { display: inline-block; stroke-width: 2; vector-effect: non-scaling-stroke; }
  </style>
</head>

<body class="bg-[#fbfaf6] text-slate-950 antialiased selection:bg-gold/30 selection:text-forest">
    <header class="fixed inset-x-20 top-2 z-50 rounded-full border-transparent glass-nav">
    <nav class="mx-auto flex h-20 max-w-7xl items-center justify-between px-6 lg:px-8">
      <a href="#" class="group flex items-center gap-3 -translate-x-10" aria-label="GoldVenture Home">
        <div
          class="grid size-35 place-items-center rounded-2xl transition group-hover:scale-105 translate-x-7 -translate-y-1">
          <img src="src/logo-GoldVenture.png" alt="GoldVenture">
        </div>
        <div>
          <p id="logoText" class="text-xl font-black tracking-tight logo-text">GoldVenture</p>
          <p id="logoSubText" class="-mt-1 text-[11px] font-semibold uppercase tracking-[0.24em]">Outdoor Rental</p>
        </div>
      </a>

      <div id="desktopMenu"
        class="hidden -translate-x-4 items-center gap-1 rounded-full border border-slate-200 bg-white/70 p-1 shadow-sm lg:flex">
        <a href="#beranda"
          class="nav-link rounded-full bg-forest px-4 py-2 text-sm font-semibold whitespace-nowrap text-white transition hover:bg-forest hover:text-white">Beranda</a>
        <a href="#alat"
          class="nav-link rounded-full px-4 py-2 text-sm font-semibold whitespace-nowrap text-slate-600 transition hover:bg-slate-100 hover:text-forest">Alat</a>
        <a href="#paket"
          class="nav-link rounded-full px-4 py-2 text-sm font-semibold whitespace-nowrap text-slate-600 transition hover:bg-slate-100 hover:text-forest">Paket</a>
        <a href="#cara-sewa"
          class="nav-link rounded-full px-4 py-2 text-sm font-semibold whitespace-nowrap text-slate-600 transition hover:bg-slate-100 hover:text-forest">Cara
          Sewa</a>
        <a href="#planner"
          class="nav-link rounded-full px-4 py-2 text-sm font-semibold whitespace-nowrap text-slate-600 transition hover:bg-slate-100 hover:text-forest">Trip
          Planner</a>
        <a href="#tentang"
          class="nav-link rounded-full px-4 py-2 text-sm font-semibold whitespace-nowrap text-slate-600 transition hover:bg-slate-100 hover:text-forest">Tentang
          Kami</a>
      </div>

      <div class="hidden items-center gap-3 md:flex">
        <button data-action="Login"
          class="action-btn rounded-full px-4 py-2.5 text-sm font-bold text-forest transition hover:bg-white">Login</button>
        <button data-action="Register"
          class="action-btn rounded-full bg-gold px-5 py-2.5 text-sm font-black text-forest shadow-lg shadow-gold/25 transition hover:-translate-y-0.5 hover:bg-[#e2b454]">Register</button>
      </div>

      <button id="menuToggle"
        class="grid size-11 place-items-center rounded-full border border-slate-200 bg-white text-forest transition hover:bg-cream lg:hidden"
        aria-label="Buka menu" aria-expanded="false">
        <svg class="size-5 inline-flex items-center justify-center leading-none icon-shadcn" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>
      </button>
    </nav>
    <div id="mobileMenu"
      class="mobile-panel border-t border-slate-200 bg-white/95 px-6 shadow-xl backdrop-blur-xl lg:hidden">
      <div class="mx-auto flex max-w-7xl flex-col gap-2 py-5">
        <a href="#beranda" class="mobile-link rounded-2xl bg-forest px-4 py-3 font-bold text-white">Beranda</a>
        <a href="#alat" class="mobile-link rounded-2xl px-4 py-3 font-bold text-slate-600 hover:bg-cream">Alat</a>
        <a href="#paket" class="mobile-link rounded-2xl px-4 py-3 font-bold text-slate-600 hover:bg-cream">Paket</a>
        <a href="#cara-sewa" class="mobile-link rounded-2xl px-4 py-3 font-bold text-slate-600 hover:bg-cream">Cara
          Sewa</a>
        <a href="#planner" class="mobile-link rounded-2xl px-4 py-3 font-bold text-slate-600 hover:bg-cream">Trip
          Planner</a>
        <a href="#tentang" class="mobile-link rounded-2xl px-4 py-3 font-bold text-slate-600 hover:bg-cream">Tentang
          Kami</a>
      </div>
    </div>
  </header>
</body>
</html>
